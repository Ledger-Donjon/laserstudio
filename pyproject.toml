[project]
name = "laserstudio"
dynamic = ["version"]
description = "Python3 software for hardware evaluation"
authors = [
    { name = "Olivier Hériveaux", email = "olivier.heriveaux@ledger.fr" },
    { name = "Michaël Mouchous", email = "michael.mouchous@ledger.fr" },
]
license = "LGPL-3.0-or-later"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyqt6",
    "pystages==1.5.0rc2",
    "pillow>=10.4.0",
    "opencv-python>=4.9.0.80",
    "pyyaml",
    "jsonschema>=4.0",
    "shapely",
    "triangle",
    "requests>=2.32.3,<3.0.0",
    "numpy>=1.26",
    "pypdm>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "hidapi>=0.14.0",
    "colorama",
    "donjon_hyshlr",
    "scipy",
    "PyQt6-Charts",
    "pylmscontroller>=1.1",
]
requires-python = ">=3.10,<3.13"

[tool.poetry]
version = "1.1.0"

[project.urls]
Documentation = "https://laserstudio.readthedocs.io/"

[project.scripts]
chipscan = 'laserstudio.utils.chipscan.__main__:main'
laserstudio = 'laserstudio.__main__:main'
laserstudio_listdevices = 'laserstudio.instruments.list_serials:list_devices'
laserstudio_generate_config_cli = 'laserstudio.config_generator:main_cli'
laserstudio_generate_config = 'laserstudio.config_generator:main_gui'
laserstudio_mcp = 'laserstudio.mcpserver.__main__:main'

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
lint = ["mypy", "types-pyserial", "types-PyYAML", "types-requests", "scipy-stubs", "hidapi-stubs"]
docs = ["sphinx", "sphinx-rtd-theme", "myst_parser"]
mcp = ["mcp>=1.2"]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.poetry-dynamic-versioning.substitution]
files = ["laserstudio/__init__.py"]

[tool.poetry-dynamic-versioning.files."laserstudio/__init__.py"]
persistent-substitution = true

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "typings"